kind = "web"
previewPath = "/"
title = "Football Pool Calculator"
version = "1.0.0"
id = "artifacts/football-pool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19696

[services.development]
run = "pnpm --filter @workspace/football-pool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/football-pool", "run", "build" ]
publicDir = "artifacts/football-pool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19696"
BASE_PATH = "/"
